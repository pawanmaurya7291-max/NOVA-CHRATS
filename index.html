<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Key - Auto Copy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            background: #1e293b;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 400px;
            border: 1px solid #334155;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #e2e8f0;
        }

        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* बटन का डिज़ाइन */
        .get-key-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 18px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .get-key-btn:active {
            transform: scale(0.96);
        }

        .get-key-btn:disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
            color: #94a3b8;
        }

        /* स्टेटस मैसेज दिखाने के लिए */
        .status {
            margin-top: 25px;
            font-size: 15px;
            font-weight: 500;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border-radius: 8px;
            transition: all 0.3s ease;
            word-break: break-all;
        }

        .status.loading { background: #fef08a; color: #854d0e; }
        .status.success { background: #bbf7d0; color: #166534; }
        .status.error { background: #fecaca; color: #991b1b; }

        /* जेनरेट हुआ लिंक दिखाने के लिए */
        .link-box {
            display: none;
            margin-top: 20px;
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #334155;
            word-break: break-all;
            color: #60a5fa;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🔗</div>
        <h1>Link Shortener</h1>
        <p>Click the button below to generate a short link. It will be copied to your clipboard automatically.</p>

        <!-- बटन -->
        <button class="get-key-btn" id="getKeyBtn">
            GET KEY
        </button>

        <!-- स्टेटस (लोडिंग/सक्सेस/एरर) -->
        <div class="status" id="statusText" style="display: none;"></div>

        <!-- जेनरेट हुआ लिंक यहाँ दिखेगा -->
        <div class="link-box" id="linkBox"></div>
    </div>

    <script>
        const API_KEY = '880fc1d716bc2aa123a6d7dfc90b89991bb83a25'; // आपकी नई API Key
        const TARGET_URL = 'https://google.com'; // जिस लिंक को शॉर्ट करना है

        const btn = document.getElementById('getKeyBtn');
        const statusText = document.getElementById('statusText');
        const linkBox = document.getElementById('linkBox');

        // स्टेटस बदलने का फंक्शन
        function updateStatus(message, type) {
            statusText.style.display = 'flex';
            statusText.textContent = message;
            statusText.className = 'status ' + type;
        }

        btn.addEventListener('click', async () => {
            // बटन डिसेबल करें और लोडिंग दिखाएं
            btn.disabled = true;
            btn.innerHTML = 'Generating...';
            linkBox.style.display = 'none';
            updateStatus('⏳ Please wait, generating link...', 'loading');

            try {
                // API URL तैयार करें
                const apiUrl = `https://go.urlking.in/api?api=${API_KEY}&url=${encodeURIComponent(TARGET_URL)}`;

                // API को कॉल करें
                const response = await fetch(apiUrl);
                const data = await response.json();

                console.log("API Response:", data); // डिबगिंग के लिए

                // अगर API में कोई एरर है
                if (data.status === 'error') {
                    throw new Error(data.message || 'API returned an error');
                }

                // शॉर्ट लिंक निकालें (shortenedUrl या shorturl)
                const shortUrl = data.shortenedUrl || data.shorturl || data.short_url;

                if (!shortUrl) {
                    throw new Error('Link not found in response');
                }

                // लिंक को कॉपी करें
                await navigator.clipboard.writeText(shortUrl);

                // UI अपडेट करें
                btn.innerHTML = '✅ Copied!';
                updateStatus('Link generated & copied successfully!', 'success');
                
                // लिंक को स्क्रीन पर भी दिखाएं
                linkBox.style.display = 'block';
                linkBox.textContent = shortUrl;

                // 3 सेकंड बाद बटन वापस नॉर्मल कर दें
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = 'GET KEY';
                }, 3000);

            } catch (error) {
                console.error(error);
                // अगर एरर आए
                btn.disabled = false;
                btn.innerHTML = 'GET KEY';
                updateStatus('❌ ' + error.message, 'error');
            }
        });
    </script>

</body>
</html>
