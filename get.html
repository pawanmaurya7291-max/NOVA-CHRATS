<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05070a" />
<title>NOVA CHETS • Your Key</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070a; --panel:rgba(255,255,255,.03); --border:rgba(255,255,255,.08);
    --text:#eef2f7; --muted:#69708a; --accent:#00d68f; --accent-2:#22d3ee;
    --green:#22c55e; --red:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
  body{
    background:var(--bg); color:var(--text); min-height:100vh; display:flex;
    align-items:center; justify-content:center; padding:20px; overflow-x:hidden;
    background-image: radial-gradient(800px 500px at 10% 0%, rgba(0,214,143,.15), transparent 60%),
                      radial-gradient(600px 400px at 90% 100%, rgba(34,211,238,.15), transparent 60%);
  }
  .container{ width:100%; max-width:440px; z-index:10; }
  .logo{
    width:80px; height:80px; border-radius:24px; margin:0 auto 20px;
    display:grid; place-items:center; font-size:36px;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow:0 8px 24px rgba(0,214,143,.3);
  }
  .title{
    text-align:center; font-size:24px; font-weight:900; margin-bottom:8px;
    background:linear-gradient(135deg, #fff 20%, var(--accent-2) 60%, var(--accent) 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .subtitle{
    text-align:center; font-size:11px; color:var(--muted); letter-spacing:2px;
    text-transform:uppercase; font-family:'JetBrains Mono',monospace; margin-bottom:24px;
  }
  .card{
    padding:24px; border-radius:22px; background:var(--panel); border:1px solid var(--border);
    backdrop-filter:blur(12px); box-shadow:0 12px 40px rgba(0,0,0,.5);
  }
  .key-box{
    background:rgba(0,214,143,.1); border:1px solid rgba(0,214,143,.3);
    padding:18px 14px; border-radius:12px; text-align:center; margin-bottom:14px;
  }
  .key-box .lbl{ font-size:9px; font-weight:800; color:var(--accent); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:6px;}
  .key-text{
    font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:900;
    color:#fff; letter-spacing:1px; word-break:break-all;
  }
  .device-box{
    background:rgba(34,211,238,.08); border:1px solid rgba(34,211,238,.3);
    padding:14px; border-radius:12px; text-align:center; margin-bottom:14px;
  }
  .device-box .lbl{ font-size:9px; font-weight:800; color:var(--accent-2); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:6px;}
  .device-text{
    font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:700;
    color:#fff; letter-spacing:.5px; word-break:break-all;
  }
  .info-row{
    display:flex; justify-content:space-between; font-size:11.5px;
    padding:8px 0; border-bottom:1px solid var(--border);
    font-family:'JetBrains Mono',monospace; text-align:left;
  }
  .info-row span:first-child{ color:var(--muted); }
  .info-row span:last-child{ color:var(--text); font-weight:700; }
  .info-row:last-of-type{ border-bottom:none; }
  .copy-btn{
    width:100%; padding:14px; margin-top:16px; border-radius:12px;
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    border:none; color:#02150f;
    font-weight:900; font-size:13px; cursor:pointer; transition:.2s;
    font-family:'JetBrains Mono',monospace;
    letter-spacing:.5px; text-transform:uppercase;
    box-shadow:0 4px 16px rgba(0,214,143,.3);
  }
  .copy-btn:hover{ opacity:.95; transform:translateY(-1px); }
  .note{
    margin-top:14px; font-size:11px; color:var(--muted); text-align:center; line-height:1.5;
  }
  .error-alert {
    background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.3); color:#fca5a5;
    padding: 12px; border-radius: 12px; font-size: 12px; margin-bottom: 15px; display: none;
  }
  .loader{ display:inline-block; width:16px; height:16px; border:3px solid rgba(0,0,0,.2); border-top-color:#000; border-radius:50%; animation:spin 1s linear infinite; vertical-align:middle; margin-right:8px;}
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
  <div class="logo">🔑</div>
  <div class="title">Your License Key</div>
  <div class="subtitle">NOVA CHETS Premium Access</div>
  
  <div class="card">
    <div id="errorAlert" class="error-alert"></div>

    <div class="key-box">
      <div class="lbl">YOUR WORKING KEY</div>
      <div class="key-text" id="resKey">LOADING...</div>
    </div>

    <div class="device-box">
      <div class="lbl">YOUR DEVICE ID (FOR VERIFICATION)</div>
      <div class="device-text" id="resDevice">LOADING...</div>
    </div>
    
    <div class="info-row">
      <span>Duration</span>
      <span>24 hours</span>
    </div>
    <div class="info-row">
      <span>Max Devices</span>
      <span>1</span>
    </div>
    <div class="info-row">
      <span>Timer Mode</span>
      <span style="color:var(--green)">Starts on First Login</span>
    </div>

    <button class="copy-btn" id="copyBtn" onclick="copyKey()" disabled>GENERATING...</button>

    <div class="note">Device ID sirf verification ke liye hai — app isse device verify karega. Key sirf isi device pe activate hogi.</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAL9GGrvA2p-suTm2GqA32YYIHmz8RvyaM",
  authDomain: "dexx-ter-pro.firebaseapp.com",
  databaseURL: "https://dexx-ter-pro-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dexx-ter-pro",
  storageBucket: "dexx-ter-pro.firebasestorage.app",
  messagingSenderId: "869110770961",
  appId: "1:869110770961:web:911a09fb605b849e7170b0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const USERS_NODE = "FIXA_MODS";
const DEVICE_STORAGE_KEY = "fixamods_device_id";
const KEY_STORAGE_KEY = "fixamods_saved_key";

let currentKey = "";

function randomKey() {
    const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ";
    const digits  = "0123456789";
    let block2 = "", block3 = "";
    for (let i = 0; i < 4; i++) block2 += letters[Math.floor(Math.random() * letters.length)];
    for (let i = 0; i < 4; i++) block3 += digits[Math.floor(Math.random() * digits.length)];
    return `NOVA-${block2}-${block3}-P2077`;
}

function getOrCreateDeviceId() {
    let id = localStorage.getItem(DEVICE_STORAGE_KEY);
    if (id) return id;
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789";
    let raw = "";
    for (let i = 0; i < 12; i++) raw += chars[Math.floor(Math.random() * chars.length)];
    id = `FIXA-${raw.slice(0,4)}-${raw.slice(4,8)}-${raw.slice(8,12)}`;
    localStorage.setItem(DEVICE_STORAGE_KEY, id);
    return id;
}

// Jab page load ho toh key generate karo
async function init() {
    const keyEl = document.getElementById("resKey");
    const deviceEl = document.getElementById("resDevice");
    const btn = document.getElementById("copyBtn");
    
    try {
        const deviceId = getOrCreateDeviceId();
        deviceEl.textContent = deviceId;

        // Pehle check karo saved key
        const savedKey = localStorage.getItem(KEY_STORAGE_KEY);
        if (savedKey) {
            const snapshot = await get(ref(db, `${USERS_NODE}/${savedKey}`));
            if (snapshot.exists()) {
                currentKey = savedKey;
                keyEl.textContent = savedKey;
                btn.textContent = "📋 COPY KEY";
                btn.disabled = false;
                return;
            } else {
                localStorage.removeItem(KEY_STORAGE_KEY);
            }
        }

        // Nayi key banao
        const newKey = randomKey();
        const payload = {
            username: "FreeUser_" + Math.floor(Math.random() * 10000),
            status: "ACTIVE",
            keyStatus: "ACTIVE",
            validityMode: "duration",
            maxDevices: 1,
            devices: { [deviceId]: { addedAt: new Date().toISOString() } },
            deviceId: deviceId,
            durationValue: 24,
            durationUnit: "hours",
            validity: "",
            firstLogin: "",
            lastLogin: "",
            createdAt: new Date().toISOString()
        };

        await set(ref(db, `${USERS_NODE}/${newKey}`), payload);

        localStorage.setItem(KEY_STORAGE_KEY, newKey);
        currentKey = newKey;
        
        keyEl.textContent = newKey;
        btn.textContent = "📋 COPY KEY";
        btn.disabled = false;

    } catch (err) {
        console.error(err);
        document.getElementById("errorAlert").style.display = "block";
        document.getElementById("errorAlert").textContent = "Error: " + (err.message.includes("PERMISSION_DENIED") ? "Firebase Rules me write allow karein." : err.message);
        keyEl.textContent = "ERROR";
        btn.textContent = "ERROR";
    }
}

// Page load hone par function call karo
window.onload = init;

window.copyKey = function() {
    if (!currentKey) return;

    const ta = document.createElement("textarea");
    ta.value = currentKey;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    
    try {
        const successful = document.execCommand('copy');
        if (successful) {
            const btn = document.getElementById("copyBtn");
            btn.textContent = "✅ COPIED!";
            setTimeout(() => btn.textContent = "📋 COPY KEY", 2000);
        } else {
            alert("Copy failed. Long press the key to copy.");
        }
    } catch (err) {
        alert("Copy failed. Long press the key to copy.");
    }
    
    document.body.removeChild(ta);
}
</script>
</body>
</html>
